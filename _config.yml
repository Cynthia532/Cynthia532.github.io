title: Cynthia's Homepage
description: Personal academic homepage
markdown: kramdown
theme: null
baseurl: ""
url: "https://cynthia532.github.io"

classic_pages:
  en: /classic/en/
  zh: /classic/zh/

exclude:
  - room-app
  - scripts
  - _design
  - .cache
  - Gemfile
  - Gemfile.lock
  - node_modules
  # Jekyll 3 replaces default exclusions; CI installs Ruby gems under vendor/bundle.
  - vendor
  - README.md

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
