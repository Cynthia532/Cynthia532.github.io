<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-lang="en">

  <!-- ========== Particle Canvas Background ========== -->
  <canvas id="particle-canvas"></canvas>

  <!-- ========== Top Navigation Bar ========== -->
  <nav class="navbar">
    <!-- Left: Brand + Nav Links grouped together -->
    <div class="nav-left">
      <div class="nav-brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-text">礽曦</span>
      </div>

      <div class="nav-links">
        <a href="/" class="nav-item active" data-page="home">
          <span class="nav-icon">⌂</span>
          <span class="nav-label" data-en="HOME" data-zh="主页">HOME</span>
        </a>

        <!-- === ADD MORE NAV ITEMS HERE === -->
        <!-- Example: Blog button (uncomment when ready)
        <a href="/blog/" class="nav-item" data-page="blog">
          <span class="nav-icon">✎</span>
          <span class="nav-label" data-en="BLOG" data-zh="博客">BLOG</span>
        </a>
        -->
        <!-- ================================ -->
      </div>
    </div>

    <!-- Right: Controls + Mobile menu button -->
    <div class="nav-controls">
      <button id="lang-toggle" class="ctrl-btn" title="Switch Language">
        <span class="ctrl-icon lang-text-icon" id="lang-label">文/EN</span>
      </button>
      <button id="theme-toggle" class="ctrl-btn" title="Toggle Theme">
        <span class="ctrl-icon" id="theme-icon">☀</span>
      </button>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        ☰
      </button>
    </div>
  </nav>

  <!-- ========== Mobile Nav Drawer (hidden on desktop) ========== -->
  <div class="mobile-nav-drawer" id="mobile-nav-drawer">
    <a href="/" class="nav-item active" data-page="home">
      <span class="nav-icon">⌂</span>
      <span class="nav-label" data-en="HOME" data-zh="主页">HOME</span>
    </a>
    <!-- === ADD MORE MOBILE NAV ITEMS HERE (mirror desktop) === -->
    <!-- Example:
    <a href="/blog/" class="nav-item" data-page="blog">
      <span class="nav-icon">✎</span>
      <span class="nav-label" data-en="BLOG" data-zh="博客">BLOG</span>
    </a>
    -->
  </div>

  <!-- ========== Main Layout ========== -->
  <div class="main-layout">

    <!-- Content Area -->
    <main class="content-area" id="content-area">
      <article class="markdown-body" id="markdown-content">
        <h1 id="-blog">📝 Blog</h1>

<div data-lang="en">
Welcome to my blog!  
Here I share my learning notes, reflections, and research insights.
</div>

<div data-lang="zh" style="display:none;">
欢迎来到我的博客！  
这里记录了我的学习笔记、思考与研究体会。
</div>

<hr />


      </article>
    </main>

    <!-- Right Sidebar - Auto-generated TOC -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title" data-en="ON THIS PAGE" data-zh="页面导航">ON THIS PAGE</div>
      <nav class="toc" id="toc-nav">
        <!-- Auto-populated by toc.js -->
      </nav>
    </aside>

  </div>

  <!-- ========== Footer ========== -->
  <footer class="site-footer">
    <span>© 2025 Zhixin Zhu. All rights reserved.</span>
  </footer>

  <!-- ========== JS Modules ========== -->
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/language.js"></script>
  <script src="/assets/js/toc.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/particles.js"></script>
  <script src="/assets/js/mobile.js"></script>
  <script src="/assets/script.js" defer></script>
</body>
</html>
